name: CI

# The same command a contributor runs locally, on every pull request. Pushes to
# main are covered by the test step in deploy.yml, which gates the live site, so
# this does not repeat that work.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # check-names, then typecheck, then vitest. scripts/check-names.mjs is
      # meant to run in both the pre-commit hook and CI.
      - run: npm test

      # The site build has to pass as well as the tests.
      - run: npm run build
