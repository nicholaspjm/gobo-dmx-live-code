name: Release connector

# Builds the standalone connector for each OS and attaches it to a release.
# A single executable is built by copying the running node binary and injecting
# the app into it, so each platform's binary has to be built on that platform.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: gobo-connector-windows.exe
          - os: macos-latest
            artifact: gobo-connector-macos
          - os: ubuntu-latest
            artifact: gobo-connector-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Check it starts and serves
        shell: bash
        run: |
          # Proves the binary runs on a clean machine rather than only building.
          #
          # The flags are load-bearing. A packaged connector adds itself as a
          # login item and opens the hosted app the first time it runs, and a CI
          # runner is neither a machine anyone logs into nor one with a browser
          # to open. Without them this step is testing the wrong thing on a
          # machine that cannot do it.
          ./release/${{ matrix.artifact }} --no-install --no-open &
          PID=$!
          sleep 5
          curl -sf --max-time 5 http://localhost:3001/ > /dev/null && echo "connector responded" || (echo "connector did not respond"; exit 1)
          kill $PID
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  desktop:
    # The desktop build is the connector plus the editor in one window, for
    # people who would rather install an app than run a loose executable.
    # electron-builder produces a platform's installers only on that platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pattern: 'release/desktop/*.exe'
          - os: macos-latest
            pattern: 'release/desktop/*.dmg'
          - os: ubuntu-latest
            pattern: 'release/desktop/*.AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run desktop:package
        env:
          # Nothing here is signed, and electron-builder should not go looking
          # for a certificate or try to notarise.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List what was built
        shell: bash
        run: ls -lh release/desktop || true
      - uses: actions/upload-artifact@v7
        with:
          name: gobo-desktop-${{ matrix.os }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dl
          merge-multiple: true
      - run: ls -lh dl
      - uses: softprops/action-gh-release@v3
        with:
          files: dl/*
          generate_release_notes: true
          body: |
            ## Running a rig from the hosted app

            A browser cannot open a UDP socket, so Art-Net and sACN need one
            small native program. Download the connector for your system, run
            it, then open
            https://nicholaspjm.github.io/gobo-dmx-live-code/ and press
            ctrl+enter. Nothing else to install.

            | System | File |
            |---|---|
            | Windows | `gobo-connector-windows.exe` |
            | macOS | `gobo-connector-macos` |
            | Linux | `gobo-connector-linux` |

            Or install the desktop app, which is the connector and the editor
            in one window: `gobo Setup <version>.exe` on Windows, the `.dmg` on
            macOS, the `.AppImage` on Linux.

            The binaries are unsigned, so Windows SmartScreen and macOS
            Gatekeeper will warn on first run. On macOS you may need
            `chmod +x gobo-connector-macos` and to allow it under Privacy and
            Security.

            Using a USB DMX interface instead? No download is needed: pick it
            with the `usb()` output straight from the browser.
