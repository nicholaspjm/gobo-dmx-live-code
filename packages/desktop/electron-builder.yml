# Packaging for the gobo desktop app.
#
# Run it from the repository root with `npm run desktop:package`, which builds
# the UI, the bridge and this package first. electron-builder builds for the
# platform it runs on: Windows installers come from Windows, and a signed macOS
# build has to come from macOS.
#
# Everything the app needs at runtime is under extraResources, which lands in
# resources/ as plain files rather than inside app.asar. The main process
# imports the bridge as ESM and the bridge resolves `ws` through ordinary Node
# module lookup, and neither is worth making work through an archive. main.ts
# reads these same paths from process.resourcesPath.

appId: dev.gobo.app
productName: gobo
copyright: gobo contributors

directories:
  output: ../../release/desktop
  buildResources: build

# The same four-bar ramp the browser tab and the wordmark use, so the app and
# the page read as one thing. Drawn from the favicon's own shapes on the app's
# background colour, at 1024px; electron-builder derives the rest.
icon: build/icon.png

files:
  - dist/**/*
  - package.json

extraResources:
  # The built editor, served by the bridge over HTTP.
  - from: ../../dist
    to: ui
  # The bridge itself, the same build the connector ships.
  - from: ../../packages/bridge/dist
    to: bridge/dist
  # The bridge's only runtime dependency. It sits where Node's resolver looks
  # when climbing up from resources/bridge/dist/index.js.
  - from: ../../node_modules/ws
    to: bridge/node_modules/ws

win:
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.music
  target:
    - dmg
    - zip
  # Ad-hoc signed: a signature with no certificate behind it. There is no Apple
  # Developer ID here, and without one electron-builder skips signing entirely,
  # which on Apple Silicon is worse than it sounds. It modifies the Electron
  # binary it starts from, so that binary's own seal no longer matches, and
  # codesign --verify fails with "code has no resources but signature indicates
  # they must be present". A downloaded app in that state is reported as
  # damaged, with Move to Trash as the only offer. Signed ad hoc, it is merely
  # from an unidentified developer, which System Settings lets you open.
  #
  # Hardened runtime off because ad hoc has no team, and the hardened runtime's
  # library validation would refuse Electron's own frameworks for not sharing
  # one. Notarisation would need it on; notarisation needs a Developer ID too.
  identity: '-'
  hardenedRuntime: false

linux:
  category: AudioVideo
  # The .deb format requires a maintainer, and electron-builder falls back to
  # the package author's email when one is not set. There is deliberately no
  # email anywhere in this project — SECURITY.md routes reports through a
  # private GitHub advisory and everything else through issues — so it is given
  # here explicitly rather than by putting a personal address in package.json
  # and shipping it inside every Linux build.
  maintainer: gobo contributors <nicholaspjm@users.noreply.github.com>
  target:
    - AppImage
    - deb
